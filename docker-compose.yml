name: metapulse

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: metapulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metapulse}
      POSTGRES_DB: metapulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metapulse -d metapulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      # 6379 на хосте часто занят; наружу отдаём 6380, внутри сети — обычный 6379
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metapulse:${POSTGRES_PASSWORD:-metapulse}@postgres:5432/metapulse
      REDIS_URL: redis://redis:6379/0
    volumes:
      - llmlogs:/app/logs/llm
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command: arq app.pipeline.worker.WorkerSettings
    # Воркер не слушает HTTP, поэтому healthcheck из образа тут не годится:
    # arq --check читает свой health-ключ в Redis, который воркер обновляет сам
    healthcheck:
      test: ["CMD", "arq", "app.pipeline.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://metapulse:${POSTGRES_PASSWORD:-metapulse}@postgres:5432/metapulse
      REDIS_URL: redis://redis:6379/0
    volumes:
      - llmlogs:/app/logs/llm
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      web: {condition: service_started}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  llmlogs:
  caddydata:
  caddyconfig:
