# Оверлей для развёртывания на собственном сервере рядом с другими стеками.
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#
# Отличия от локального запуска:
#   * HTTPS и домен обслуживает существующий Nginx Proxy Manager, а не свой Caddy;
#   * резюме считает локальная Ollama из соседнего стека (сеть interviewvault_default);
#   * запросы к YouTube идут через singbox: домен из России напрямую недоступен;
#   * наружу ничего не публикуется — прокси ходит к web по имени внутри общей сети;
#   * заданы лимиты ресурсов: сервер делится с чужими сервисами и Minecraft.
#
# Внимание: базовый файл в одиночку здесь запускать нельзя — он публикует 80/443 и 8000,
# которые уже заняты прокси и панелью Crafty. Всегда с этим оверлеем.

services:
  caddy:
    # HTTPS уже терминирует NPM; свой прокси только занял бы 80/443
    profiles: ["disabled"]

  # На сервере 5432 и 6380 заняты соседними стеками, а публиковать их незачем:
  # web и worker ходят к базе и очереди внутри compose-сети по именам сервисов.
  metapulse-postgres:
    ports: !override []
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1g}

  metapulse-redis:
    ports: !override []
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256m}

  metapulse-web:
    ports: !override []
    environment:
      OLLAMA_URL: http://ollama:11434
      YOUTUBE_PROXY: http://singbox:1081
    networks:
      default: {}
      stoat_default:
        aliases: [metapulse]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768m}

  metapulse-worker:
    environment:
      OLLAMA_URL: http://ollama:11434
      YOUTUBE_PROXY: http://singbox:1081
    networks:
      default: {}
      stoat_default: {}
      interviewvault_default: {}
    deploy:
      resources:
        # Скрапинг и разбор транскриптов упираются в сеть, а не в процессор:
        # тяжёлые вычисления уходят в Ollama, которой отведены свои потоки
        limits: {cpus: "2.0", memory: 1g}

networks:
  stoat_default:
    external: true
  interviewvault_default:
    external: true
